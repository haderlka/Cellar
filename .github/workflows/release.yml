name: Release

# Push a tag like v0.1.0 to build all platforms and create a draft GitHub
# Release with the binaries attached. Run it manually (Actions tab) to test
# the builds without creating a release.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --locked
    - name: Package
      shell: pwsh
      run: |
        $v = "${{ github.ref_name }}"
        New-Item -ItemType Directory dist | Out-Null
        Copy-Item target/release/cellar.exe "dist/cellar-$v-windows-x64.exe"
        Compress-Archive -Path target/release/cellar.exe, README.md, LICENSE `
          -DestinationPath "dist/cellar-$v-windows-x64.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: dist/*

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add targets
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - name: Build (Apple Silicon and Intel)
      run: |
        cargo build --release --locked --target aarch64-apple-darwin
        cargo build --release --locked --target x86_64-apple-darwin
    - name: Assemble Cellar.app
      run: |
        VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        APP=build/Cellar.app
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

        # One universal binary that runs on both Apple Silicon and Intel.
        lipo -create -output "$APP/Contents/MacOS/cellar" \
          target/aarch64-apple-darwin/release/cellar \
          target/x86_64-apple-darwin/release/cellar

        # App icon from the rendered logo.
        mkdir Cellar.iconset
        for s in 16 32 128 256 512; do
          sips -z $s $s assets/icon-1024.png --out Cellar.iconset/icon_${s}x${s}.png
          d=$((s * 2))
          sips -z $d $d assets/icon-1024.png --out Cellar.iconset/icon_${s}x${s}@2x.png
        done
        iconutil -c icns Cellar.iconset -o "$APP/Contents/Resources/Cellar.icns"

        cat > "$APP/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Cellar</string>
          <key>CFBundleDisplayName</key><string>Cellar</string>
          <key>CFBundleIdentifier</key><string>io.github.haderlka.cellar</string>
          <key>CFBundleExecutable</key><string>cellar</string>
          <key>CFBundleIconFile</key><string>Cellar</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <!-- Finder opens .cellar files with Cellar (src/gui/open_files.rs);
               Excel and CSV files list Cellar under "Open With". -->
          <key>CFBundleDocumentTypes</key>
          <array>
            <dict>
              <key>CFBundleTypeName</key><string>Cellar Workbook</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSHandlerRank</key><string>Owner</string>
              <key>LSItemContentTypes</key>
              <array><string>io.github.haderlka.cellar.workbook</string></array>
            </dict>
            <dict>
              <key>CFBundleTypeName</key><string>Spreadsheet</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSHandlerRank</key><string>Alternate</string>
              <key>LSItemContentTypes</key>
              <array>
                <string>org.openxmlformats.spreadsheetml.sheet</string>
                <string>public.comma-separated-values-text</string>
              </array>
            </dict>
          </array>
          <key>UTExportedTypeDeclarations</key>
          <array>
            <dict>
              <key>UTTypeIdentifier</key><string>io.github.haderlka.cellar.workbook</string>
              <key>UTTypeDescription</key><string>Cellar Workbook</string>
              <key>UTTypeIconFile</key><string>Cellar</string>
              <!-- .cellar files are JSON, so Quick Look shows them as text. -->
              <key>UTTypeConformsTo</key>
              <array><string>public.json</string></array>
              <key>UTTypeTagSpecification</key>
              <dict>
                <key>public.filename-extension</key>
                <array><string>cellar</string></array>
              </dict>
            </dict>
          </array>
        </dict>
        </plist>
        EOF

        # Ad-hoc signature (no Apple Developer account needed). Users still
        # have to right-click > Open the first time; see the release notes.
        codesign --force --deep --sign - "$APP"
    - name: Create DMG
      run: |
        mkdir -p dmg dist
        cp -R build/Cellar.app dmg/
        ln -s /Applications dmg/Applications
        hdiutil create -volname Cellar -srcfolder dmg -ov -format UDZO \
          "dist/cellar-${{ github.ref_name }}-macos-universal.dmg"
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: dist/*

  linux:
    # Oldest supported runner, so the binary works on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux GUI libraries
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libssl-dev
    - name: Build
      run: cargo build --release --locked
    - name: Package
      run: |
        NAME=cellar-${{ github.ref_name }}-linux-x64
        mkdir -p "$NAME" dist
        cp target/release/cellar README.md LICENSE assets/icon-256.png "$NAME/"
        tar czf "dist/$NAME.tar.gz" "$NAME"
    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Checksums
      run: cd dist && sha256sum * > SHA256SUMS.txt
    - uses: softprops/action-gh-release@v2
      with:
        draft: true
        generate_release_notes: true
        files: dist/*
