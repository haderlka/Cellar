name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux GUI libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libssl-dev
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      run: cargo test
    - name: Build release
      run: cargo build --release
