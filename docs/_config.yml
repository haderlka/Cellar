# GitHub Pages site for Cellar's documentation (Settings → Pages →
# "Deploy from a branch", folder /docs). Built by GitHub with Jekyll.
title: Cellar
description: A desktop spreadsheet whose workbooks are plain, readable text. User guide and reference.
url: https://haderlka.github.io
baseurl: /Cellar

# Sidebar navigation and search. Pinned so a theme update can't change
# the site unannounced.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
heading_anchors: true
# Boxes written as {: .note } and {: .warning } after a paragraph.
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Important
    color: yellow
aux_links:
  "Cellar on GitHub":
    - https://github.com/haderlka/Cellar
  "Download":
    - https://github.com/haderlka/Cellar/releases
footer_content: 'Cellar is free and open source (MIT). Built on <a href="https://github.com/SamuelSchlesinger/tshts">tshts</a>.'
back_to_top: true
back_to_top_text: Back to top
